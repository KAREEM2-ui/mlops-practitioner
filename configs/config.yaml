server:
  host: "0.0.0.0"
  port: 8000
  workers: 1

model:
  path: "model.onnx"
  input_name: "input"
  input_shape: [1, 3, 224, 224]
  classes: 1000

pipeline:
  target_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

validation:
  ImageMaxSizeMb: 10
  MaxHorizontalPixels: 3840
  MaxVerticalPixels: 2160