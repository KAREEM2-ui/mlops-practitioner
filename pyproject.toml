[project]
name = "proj-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdulkarim", email = "kar123580@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
proj-1 = "proj_1.main:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
]
train = [
    "kaggle>=2.2.4",
    "onnx>=1.22.0",
    "onnxscript>=0.7.2",
    "ultralytics>=8.4.155",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: runs unit tests"]
