[project]
name = "proj-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdulkarim", email = "kar123580@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
proj-1 = "proj_1.main:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "mlflow>=3.16.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "httpx>=0.27.0",
]

train = [
    "dvc>=3.67.1",
    "kaggle>=2.2.4",
    "mlflow>=3.16.1",
    "onnx>=1.22.0",
    "onnxscript>=0.7.2",
    "ultralytics>=8.4.155",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: runs unit tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["notebooks", "dataset", "htmlcov"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
